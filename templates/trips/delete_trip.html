{% extends 'base.html' %}

{% block title %}Delete Trip{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow mx-auto text-center"
         style="max-width: 550px;">

        <div class="card-body p-5">

            <div style="font-size: 50px;">
                ⚠️
            </div>

            <h2 class="mt-3">
                Delete Trip?
            </h2>

            <p class="text-muted mt-3">
                Are you sure you want to delete
                <strong>{{ trip.trip_name }}</strong>?
            </p>

            <p class="text-danger">
                This action cannot be undone.
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">
                    Yes, Delete Trip
                </button>

                <a href="{% url 'trips:trip_detail' trip.id %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
