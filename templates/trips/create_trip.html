{% extends 'base.html' %}
{% load static %}

{% block title %}Plan Your Trip{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/trips.css' %}">
{% endblock %}

{% block content %}

<div class="create-trip-page">

    <div class="create-trip-header">

        <span>✈️ PLAN YOUR JOURNEY</span>

        <h1>Plan Your Trip</h1>

        <p>
            Create your perfect itinerary and start exploring India.
        </p>

    </div>


    <div class="trip-form-card">

        <form method="POST" class="trip-form">

            {% csrf_token %}


            <!-- Trip Name -->

            <div class="form-group">

                <label for="trip_name">
                    Trip Name
                </label>

                <input
                    type="text"
                    id="trip_name"
                    name="trip_name"
                    placeholder="Example: Goa Vacation"
                    required>

            </div>


            <!-- Destination -->

            <div class="form-group">

                <label for="destination">
                    Destination
                </label>

                <select
                    id="destination"
                    name="destination"
                    required>

                    <option value="">
                        Select Destination
                    </option>

                    {% for destination in destinations %}

                    <option value="{{ destination.id }}">
                        {{ destination.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Start Date -->

            <div class="form-group">

                <label for="start_date">
                    Start Date
                </label>

                <input
                    type="date"
                    id="start_date"
                    name="start_date"
                    required>

            </div>


            <!-- End Date -->

            <div class="form-group">

                <label for="end_date">
                    End Date
                </label>

                <input
                    type="date"
                    id="end_date"
                    name="end_date"
                    required>

            </div>


            <!-- Number of People -->

            <div class="form-group">

                <label for="number_of_people">
                    Number of People
                </label>

                <input
                    type="number"
                    id="number_of_people"
                    name="number_of_people"
                    value="1"
                    min="1"
                    required>

            </div>


            <!-- Budget -->

            <div class="form-group">

                <label for="budget">
                    Budget (₹)
                </label>

                <input
                    type="number"
                    id="budget"
                    name="budget"
                    placeholder="Example: 15000"
                    min="0"
                    required>

            </div>


            <!-- Itinerary -->

            <div class="form-group full-width">

                <label for="itinerary">
                    Itinerary
                </label>

                <textarea
                    id="itinerary"
                    name="itinerary"
                    placeholder="Day 1 - Visit beach&#10;Day 2 - Explore city"></textarea>

            </div>


            <!-- Additional Notes -->

            <div class="form-group full-width">

                <label for="additional_notes">
                    Additional Notes
                </label>

                <textarea
                    id="additional_notes"
                    name="additional_notes"
                    placeholder="Any additional travel details..."></textarea>

            </div>


            <!-- Buttons -->

            <div class="form-buttons">

                <button
                    type="submit"
                    class="create-btn">
                    Create Trip
                </button>

                <a
                    href="{% url 'trips:trip_list' %}"
                    class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
