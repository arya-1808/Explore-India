<!DOCTYPE html>
<html>
<head>
    <title>Edit Destination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            <h3>Edit Destination</h3>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="mb-3">
                    <label>Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ destination.name }}">
                </div>

                <div class="mb-3">
                    <label>Description</label>
                    <textarea
                        name="description"
                        class="form-control"
                        rows="4">{{ destination.description }}</textarea>
                </div>

                <div class="mb-3">
                    <label>City</label>
                    <input type="text"
                           name="city"
                           class="form-control"
                           value="{{ destination.city }}">
                </div>

                <div class="mb-3">
                    <label>State</label>

                    <input type="text"
                           name="state"
                           class="form-control"
                           value="{{ destination.state }}">
                </div>

                <div class="mb-3">
                    <label>Category</label>

                    <input type="text"
                           name="category"
                           class="form-control"
                           value="{{ destination.category }}">
                </div>

                <div class="mb-3">
                    <label>Best Time</label>

                    <input type="text"
                           name="best_time"
                           class="form-control"
                           value="{{ destination.best_time_to_visit }}">
                </div>

                <div class="mb-3">
                    <label>Budget Per Day</label>

                    <input type="number"
                           name="budget"
                           class="form-control"
                           value="{{ destination.avg_budget_per_day }}">
                </div>

                <div class="mb-3">

                    <label>Current Image</label><br>

                    {% if destination.image %}
                        <img src="{{ destination.image.url }}"
                             width="180"
                             class="rounded mb-2">
                    {% endif %}

                    <input type="file"
                           name="image"
                           class="form-control">
                </div>

                <button class="btn btn-success">
                    Update Destination
                </button>

                <a href="{% url 'dashboard:dashboard' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
