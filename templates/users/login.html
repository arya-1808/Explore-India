{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore India - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

    {% if messages %}
    {% for message in messages %}
        <div class="login-message">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
        <a class="navbar-brand" href="#">🌍 Explore India</a>

        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Destinations</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Trip Planner</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
    </div>
</nav>

<section class="login-section">

<div class="login-card">

<h1>Welcome Back</h1>

<p>Login to continue your journey</p>

<form method="POST">
    {% csrf_token %}

   <div class="mb-3">
    <label>Username</label>
    <input
        type="text"
        name="username"
        class="form-control"
        placeholder="Enter Username"
        required>
</div>

<div class="mb-3">
    <label>Password</label>
    <input
        type="password"
        name="password"
        class="form-control"
        placeholder="Enter Password"
        required>
</div>

    <button class="btn btn-warning w-100">
        Login
    </button>

    <div class="text-center mt-3">
        <a href="/accounts/register">Create Account</a>
    </div>
    <div class="text-center mt-3">
    <a href="{% url 'forgot_password' %}">Forgot Password?</a>
    </div>

</form>

</div>

</section>

</body>
</html>
