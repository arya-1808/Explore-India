{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">Explore <span>India</span></a>

        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'user_home' %}">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Destinations</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Packages</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
    </div>
</nav>

<section class="login-section">

    <div class="login-card">

        <h1>Change <span>Password</span></h1>
        <p>Enter your old password and choose a new one.</p>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Old Password</label>
                <input type="password"
                       name="old_password"
                       class="form-control"
                       placeholder="Enter Old Password"
                       required>
            </div>

            <div class="mb-3">
                <label>New Password</label>
                <input type="password"
                       name="new_password"
                       class="form-control"
                       placeholder="Enter New Password"
                       required>
            </div>

            <div class="mb-3">
                <label>Confirm Password</label>
                <input type="password"
                       name="confirm_password"
                       class="form-control"
                       placeholder="Confirm New Password"
                       required>
            </div>

            <button type="submit" class="btn-login">
                Change Password
            </button>

            <div class="register mt-3">
                <a href="{% url 'login' %}">← Back to Login</a>
            </div>

        </form>

    </div>

</section>

</body>
</html>
