{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">🌍 Explore India</a>

        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="{% url 'user_home' %}">
                    Home
                </a>
            </li>
        </ul>
    </div>
</nav>

<section class="login-section">

<div class="login-card">

<h1>Forgot <span>Password</span></h1>

<p>Enter your registered email and verify the OTP.</p>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-info">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Email Address</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter Registered Email"
value="{{ email }}"
required>

</div>

<button
type="submit"
name="send_otp"
value="1"
class="btn-login"
id="otpBtn"
>

Send OTP

</button>

<div class="mt-4 mb-3">

<label>Enter OTP</label>

<input
type="text"
name="otp"
class="form-control"
placeholder="Enter OTP"
>

</div>

<button
type="submit"
name="verify_otp"
value="1"
class="btn-login">

Verify OTP

</button>

<div class="register mt-4">

<a href="{% url 'login' %}">

← Back to Login

</a>

</div>

</form>

</div>

</section>

<script>

function startTimer(){

let btn=document.getElementById("otpBtn");

btn.disabled=true;

let time=30;

let timer=setInterval(function(){

btn.innerHTML="Resend OTP ("+time+"s)";

time--;

if(time<0){

clearInterval(timer);

btn.disabled=false;

btn.innerHTML="Send OTP";

}

},1000);

}

</script>

</body>

</html>
